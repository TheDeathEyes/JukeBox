<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Manif'Musik - Lecteur PC</title>
  <style>
    body { margin: 0; background: #0f0f13; color: white; font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }
    #player-container { flex: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #000; position: relative; }
    #player { width: 100%; height: 100%; pointer-events: none; }
    #sidebar { flex: 1; background: #181820; padding: 20px; display: flex; flex-direction: column; border-left: 1px solid #2a2a35; }
    h2 { margin-top: 0; color: #1db954; }
    #queue-list { list-style: none; padding: 0; overflow-y: auto; flex: 1; }
    .queue-item { display: flex; align-items: center; gap: 10px; background: #22222c; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
    .queue-item img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
    #start-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; cursor: pointer; }
    button { padding: 15px 30px; font-size: 1.2rem; background: #1db954; color: white; border: none; border-radius: 30px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
  <div id="player-container">
    <div id="start-overlay" onclick="startParty()">
      <h1>Manif'Musik prête</h1>
      <button>Cliquer ici pour activer le son</button>
    </div>
    <div id="player"></div>
  </div>

  <div id="sidebar">
    <h2>File d'attente (<span id="count">0</span>)</h2>
    <ul id="queue-list"></ul>
    <button onclick="socket.emit('nextTrack')" style="font-size: 0.9rem; padding: 10px; background: #333;">Passer la musique</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const socket = io();
    let player;
    let isStarted = false;
    let loadedVideoId = null;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        playerVars: { autoplay: 1, controls: 1, rel: 0 },
        events: {
          onStateChange: (event) => {
            if (event.data === YT.PlayerState.ENDED) socket.emit('nextTrack');
          }
        }
      });
    }

    function startParty() {
      isStarted = true;
      document.getElementById('start-overlay').style.display = 'none';
      socket.emit('nextTrack');
    }

    socket.on('updateState', ({ queue, currentTrack }) => {
      document.getElementById('count').innerText = queue.length;
      const list = document.getElementById('queue-list');
      list.innerHTML = queue.map((t, i) => `
        <li class="queue-item">
          <img src="${t.thumbnail}">
          <div>
            <div style="font-weight:bold; font-size:0.9rem;">${i + 1}. ${t.title}</div>
            <div style="font-size:0.8rem; color:#aaa;">${t.duration}</div>
          </div>
        </li>
      `).join('');

      if (!isStarted || !player || !player.loadVideoById) return;

      if (currentTrack && currentTrack.id !== loadedVideoId) {
        loadedVideoId = currentTrack.id;
        player.loadVideoById(currentTrack.id);
      } else if (!currentTrack && queue.length > 0) {
        socket.emit('nextTrack');
      }
    });

    // PING : Empêche le serveur Render de s'endormir pendant la soirée
    setInterval(() => fetch('/ping'), 5 * 60 * 1000);
  </script>
</body>
</html>
